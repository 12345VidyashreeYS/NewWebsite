<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        .main2{
            display: flex;
            /* position: fixed; */
            background-color: rgb(143, 152, 152);
            padding: 20px;
            background: linear-gradient(to top, black, grey);
        }

        #home{
            margin-right: 10px;
            font-family: sans-serif;
            font-weight: bolder;
            color: rgb(230, 186, 186);
            text-decoration: none;
            cursor: pointer;
        }

        #product{
            font-family: sans-serif;
            font-weight: bolder;
            color: rgb(230, 186, 186);
            text-decoration: none;
            cursor: pointer;
        }

        #searchone{
           margin-left: 50%;
           margin-right: 20px;
           color: rgb(0, 0, 0);
        }

        #one{
            margin-right: 20px;
        }

        .firstimg{
            background-image: url("images/BImage.png");
            background-size: cover;
            height:200px;
            width: 100%;
            background-position: center;
            background-repeat:no-repeat;
        }

        .divproduct p{
            text-align: left;
            margin-left: 40px;
            margin-top: 0px;
            padding-top: 70px;
            font-family: sans-serif;
            font-size: 30px;
            font-weight: bolder;
            text-shadow: 1px 1px #9ea2a4;
            text-transform: uppercase;
            color: #7f868b;
        }

    </style>
</head>
<body>
    
    <nav class="main2">

        <a id="home" style="color: rgb(230, 186, 186)" href="home.html">HOME</a>
        <a id="product" style="color: rgb(230, 186, 186)" href="Products.html">&#124;&nbsp;&nbsp; PRODUCTS</a>

        <input id="searchone" type="text" name="text" placeholder="search">

        diameter:
        <select id="one">
            <option>150mm</option>
            <option>250mm</option>
            <option>300mm</option>
            <option>400mm</option>
            <option>450mm</option>
            <option>600mm</option>
        </select>

        Class:
        <select id="two">
            <option>NP2</option>
            <option>NP3</option>
        </select>
    </nav>

    <article class="firstimg">

        <div class="divproduct">

            <p>Products</p>
        </div>
    </article>
</body>
</html>
